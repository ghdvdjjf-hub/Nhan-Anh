<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vui lòng Follow Fanpage</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    padding:20px;
}

.container{

    background:#fff;
    border-radius:20px;
    padding:40px 30px;
    text-align:center;
    box-shadow:0 15px 35px rgba(0,0,0,.2);
    width:82%;
    max-width:540px;
    margin:auto;
    position:relative;

    animation:popIn .7s cubic-bezier(.18,1.35,.45,1);

}

h1{
    color:#ff3b30;
    margin-bottom:16px;
    white-space: nowrap;
}

p{
    color:#555;
    line-height:1.8;
    margin-bottom:20px;
}

.loading{
    margin:30px auto 0;
    width:50px;
    height:50px;
    border:6px solid #ddd;
    border-top:6px solid #1877F2;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

.back1{
    position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        object-fit:cover;
        object-position:center;
        z-index:-2;
}

@keyframes popIn{

0%{
    opacity:0;
    transform:scale(.6) translateY(40px);
    filter:blur(8px);
}

60%{
    opacity:1;
    transform:scale(1.08) translateY(-8px);
    filter:blur(0);
}

80%{
    transform:scale(.97);
}

100%{
    transform:scale(1);
}

}
/* ===== Confetti ===== */

.confetti{
    position:fixed;
    top:-20px;
    width:8px;
    height:14px;
    border-radius:2px;
    pointer-events:none;
    z-index:9999;
    animation:fall linear forwards;
}

@keyframes fall{

0%{
    transform:translateY(-30px) rotate(0deg);
    opacity:1;
}

100%{
    transform:translateY(110vh) rotate(720deg);
    opacity:0;
}

}
</style>

</head>
<script>

const colors = [
    "#FFD43B",
    "#4FACFE",
    "#00F2FE",
    "#FF6B6B",
    "#FFFFFF"
];

let confettiInterval;

function createOneConfetti(){

    const c = document.createElement("div");

    c.className = "confetti";

    c.style.left = Math.random() * 100 + "vw";

    const size = Math.random() * 6 + 6;

    c.style.width = size + "px";
    c.style.height = size * 1.4 + "px";

    c.style.background =
        colors[Math.floor(Math.random() * colors.length)];

    c.style.animationDuration =
        (Math.random() * 2 + 3) + "s";

    document.body.appendChild(c);

    setTimeout(() => c.remove(), 5500);

}

function startConfetti(){
    confettiInterval = setInterval(createOneConfetti, 450);
}

function stopConfetti(){
    clearInterval(confettiInterval);
}

startConfetti();

const remain = Math.max(
    0,
    20000 - (Date.now() - followTime)
);

setTimeout(stopConfetti, remain);

</script>
<body>
<img src="Back1.png" class="back1">
<div class="container">

<h1>⚠️ Vui lòng Follow Fanpage</h1>

<p>
Bạn hãy Follow Fanpage trước rồi quay lại trang này để nhận ảnh nhé ❤️
</p>

<p>
Hệ thống sẽ tự động chuyển sang trang nhận ảnh khi bạn đã Follow Fanpage.
</p>

<div class="loading"></div>

</div>

<script>

const followTime = Number(sessionStorage.getItem("followTime"));

if(!followTime){
    window.location.href = "index.html";
}

function checkTime(){

    const passed = Math.floor((Date.now() - followTime)/1000);

    if(passed >= 20){

        sessionStorage.removeItem("followTime");

        window.location.href = "receive.html";

    }

}

// Kiểm tra ngay khi vào trang
checkTime();

// Kiểm tra mỗi giây
setInterval(checkTime,1000);

</script>

</body>
</html>
