<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhận ảnh | SMAE MEDIA</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;

    background:
    linear-gradient(135deg,#0A3D7A,#0F5FBF,#5EB7FF);

    position:relative;

}

/*================ Background =================*/

body::before,
body::after{

content:"";
position:absolute;
border-radius:50%;
filter:blur(40px);
animation:float 8s ease-in-out infinite;

}

body::before{

width:260px;
height:260px;
background:rgba(255,255,255,.15);

top:-80px;
left:-70px;

}

body::after{

width:300px;
height:300px;
background:rgba(255,215,0,.18);

bottom:-120px;
right:-80px;

animation-delay:2s;

}

@keyframes float{

0%,100%{

transform:translateY(0px);

}

50%{

transform:translateY(-25px);

}

}

/*================ Card =================*/

.box{

position:relative;

width:90%;
max-width:500px;

padding:45px 35px;

text-align:center;

background:rgba(255,255,255,.18);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.35);

border-radius:32px;

box-shadow:
0 25px 50px rgba(0,0,0,.25);

animation:fadeUp .8s ease;

overflow:hidden;

}

.box::before{

content:"";

position:absolute;

top:-120px;
right:-120px;

width:240px;
height:240px;

background:rgba(255,255,255,.08);

border-radius:50%;

}

/*================ Animation =================*/

@keyframes fadeUp{

from{

opacity:0;
transform:translateY(40px) scale(.9);

}

to{

opacity:1;
transform:none;

}

}

/*================ Icon =================*/

.icon{

font-size:72px;

margin-bottom:18px;

animation:bounce 2.5s infinite;

}

@keyframes bounce{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-10px);

}

}

/*================ Text =================*/

h1{

font-size:34px;
font-weight:800;
color:#fff;

margin-bottom:12px;

text-shadow:0 4px 10px rgba(0,0,0,.2);

}

p{

font-size:18px;
line-height:1.7;
color:white;
opacity:.95;

margin-bottom:35px;

}

/*================ Button =================*/

.btn{

position:relative;

display:inline-block;

padding:18px 42px;

background:linear-gradient(135deg,#FFD43B,#FFB703);

color:#0A3D7A;

font-weight:700;
font-size:20px;

text-decoration:none;

border-radius:60px;

overflow:hidden;

transition:.35s;

box-shadow:

0 10px 25px rgba(255,193,7,.45);

}

.btn:hover{

transform:translateY(-5px) scale(1.05);

box-shadow:
0 18px 35px rgba(255,193,7,.6);

}

.btn::before{

content:"";

position:absolute;

top:0;
left:-120%;

width:60%;
height:100%;

background:rgba(255,255,255,.45);

transform:skewX(-25deg);

transition:.8s;

}

.btn:hover::before{

left:160%;

}

/*================ Footer =================*/

.footer{

margin-top:28px;

font-size:14px;

color:rgba(255,255,255,.85);

}

/*================ Responsive =================*/

@media(max-width:480px){

.box{

padding:38px 25px;

}

.icon{

font-size:60px;

}

h1{

font-size:24px;

}

p{

font-size:16px;

}

.btn{

width:100%;

font-size:18px;

}

}

.bck{
    position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        object-fit:cover;
        object-position:center;
        z-index:-2;
}

.lg{
    width:120px;
        display:block;
        margin:auto;
        margin-bottom:18px;
        filter:
        drop-shadow(0 12px 20px rgba(0,90,255,.18));
        transition:.4s;
}
</style>

</head>

<body>
<img src="Back1.png" class="bck">
<div class="box">

<div class="icon">
<img src="LOGO.png" class="lg">
</div>

<h1 style="color: #0F5FBF; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif">Cảm ơn bạn đã chờ đợi!</h1>

<p style="color: rgb(111, 111, 111);">

</p>

target="_blank">

</a>

<div class="footer" style="color: rgb(93, 93, 92);">

</div>

</div>

</script>

</body>
</html>
