<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhận ảnh</title>

<style>

    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
    }

    body{

    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(135deg,#00c6ff,#0072ff);

    }

    .box{

    width:90%;
    max-width:500px;
    background:white;
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 15px 35px rgba(0,0,0,.2);

    }

    h1{

    margin-bottom:20px;

    }

    p{

    margin-bottom:25px;
    color:#555;

    }

    a{

    display:inline-block;
    background:#28a745;
    color:white;
    padding:18px 35px;
    text-decoration:none;
    border-radius:12px;
    font-size:20px;

    }

    a:hover{

    background:#218838;

    }

</style>

</head>

<body>

    <div class="box">

    <h1>🎉 Cảm ơn bạn!</h1>

    <p>Nhấn nút bên dưới để nhận ảnh.</p>

    <a href="https://drive.google.com/drive/folders/1ziDNNg4urr6xts5almCxpGH1-Kl9r4tV?usp=sharing">

    📸 NHẬN ẢNH NGAY

    </a>

    </div>

    <script>
        sessionStorage.removeItem("followTime");
    </script>
</body>
</html>
