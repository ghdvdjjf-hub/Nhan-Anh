<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SMAE MEDIA | Graduation Photobooth</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
    @font-face {
        font-family: "Bruce";
        src: url("BruceForever.otf") format("opentype");
    }
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Poppins',sans-serif;
    }

    html{
        scroll-behavior:smooth;
    }

    body{
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        overflow:hidden;
        background:
        linear-gradient(135deg,#0057D9 0%,#009DFF 45%,#43D2FF 100%);
        position:relative;
    }

    /*==========================
    BACKGROUND
    ==========================*/

    .bg-circle{
        position:absolute;
        border-radius:50%;
        filter:blur(5px);
    }

    .circle1{
        width:500px;
        height:500px;
        background:rgba(255,255,255,.08);
        top:-220px;
        left:-180px;
    }

    .circle2{
        width:320px;
        height:320px;
        background:rgba(255,170,0,.15);
        bottom:-120px;
        right:-100px;
    }

    .circle3{
        width:200px;
        height:200px;
        background:rgba(255,255,255,.05);
        top:60%;
        left:8%;
    }

    .circle4{
        width:160px;
        height:160px;
        background:rgba(255,255,255,.08);
        top:15%;
        right:12%;
    }

    /*==========================
    CONFETTI
    ==========================*/

    .confetti{
        position:absolute;
        width:10px;
        height:10px;
        border-radius:50%;
        animation:fall linear infinite;
        opacity:.75;
    }

    .c1{
        left:5%;
        animation-duration:8s;
        animation-delay:0s;
        background:#FFD84A;
    }

    .c2{
        left:18%;
        animation-duration:10s;
        animation-delay:2s;
        background:white;
    }

    .c3{
        left:30%;
        animation-duration:9s;
        animation-delay:4s;
        background:#FF9933;
    }

    .c4{
        left:45%;
        animation-duration:11s;
        animation-delay:1s;
        background:white;
    }

    .c5{
        left:58%;
        animation-duration:8s;
        animation-delay:3s;
        background:#FFD84A;
    }

    .c6{
        left:72%;
        animation-duration:10s;
        animation-delay:5s;
        background:#FF9933;
    }

    .c7{
        left:85%;
        animation-duration:9s;
        animation-delay:2s;
        background:white;
    }

    .c8{
        left:95%;
        animation-duration:8s;
        animation-delay:4s;
        background:#FFD84A;
    }

    @keyframes fall{
        0%{
            transform:
            translateY(-120px)
            rotate(0deg);
        }

        100%{
            transform:
            translateY(120vh)
            rotate(360deg);
        }
    }

    /*==========================
    GRADUATION CAPS
    ==========================*/

    .cap{
        position:absolute;
        font-size:44px;
        opacity:.12;
        user-select:none;
    }

    .cap1{
        top:40px;
        left:40px;
        transform:rotate(-20deg);
    }

    .cap2{
        top:55px;
        right:40px;
        transform:rotate(18deg);
    }

    .cap3{
        bottom:40px;
        left:60px;
        transform:rotate(15deg);
    }

    .cap4{
        bottom:50px;
        right:60px;
        transform:rotate(-18deg);
    }

    /*==========================
    MAIN CONTAINER
    ==========================*/

    .container{
        width:82%;
        max-width:540px;
        margin:auto;
        position:relative;
    }

    @keyframes fadeUp{

        from{
            opacity:0;
            transform:
            translateY(50px);
        }

        to{
            opacity:1;
            transform:
            translateY(0);
        }

    }
    /*==========================
    GLASS CARD
    ==========================*/

    .card{
        position:relative;
        background: rgba(255,255,255,0.65);
        backdrop-filter:blur(18px);
        -webkit-backdrop-filter:blur(18px);
        border-radius:34px;
        padding:3px 3px;
        overflow:hidden;
        box-shadow:
        0 30px 60px rgba(0,0,0,.18);
        border:1px solid rgba(255,255,255,.45);
    }

    /* Vòng sáng góc phải */

    .card::before{
        content:"";
        position:absolute;
        width:260px;
        height:260px;
        border-radius:50%;
        background:
        linear-gradient(135deg,#FFD54A,#FF9800);
        right:-130px;
        top:-130px;
        opacity:.16;
    }

    /* Vòng sáng góc trái */

    .card::after{
        content:"";
        position:absolute;
        width:170px;
        height:170px;
        border-radius:50%;
        background:
        linear-gradient(135deg,#4FC3FF,#007BFF);
        left:-80px;
        bottom:-80px;
        opacity:.08;
    }

    /*==========================
    LOGO
    ==========================*/

    .logo{
        width:120px;
        display:block;
        margin:auto;
        margin-bottom:18px;
        filter:
        drop-shadow(0 12px 20px rgba(0,90,255,.18));
        transition:.4s;
    }

    .logo:hover{
        transform:scale(1.06);
    }

    /*==========================
    TEXT
    ==========================*/

    .club{
        text-align: center;
        font-size:10px;
        font-weight:600;
        letter-spacing:1px;
        color:#0066DD;
        margin-bottom:4px;
        text-transform:uppercase;
    }

    .title {
        text-align: center;
        font-weight: 800;
        background: linear-gradient(90deg, #0066FF, #00B7FF, #FF9800);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
        margin-bottom: 7px;
    }

    .photoIcon{
        text-align:center;
        font-size:56px;
        animation:float 3s ease-in-out infinite;
    }

    @keyframes float{

        0%{
            transform:translateY(0);
        }

        50%{
            transform:translateY(-8px);
        }

        100%{
            transform:translateY(0);
        }
    }

    .bigTitle{
        text-align:center;
        font-size:25px;
        font-weight:700;
        color:#24324A;
        margin-bottom:18px;
        line-height:1.0;
    }

    .desc{
        text-align:center;
        font-size:10px;
        line-height:1.9;
        color:#5D6470;
        margin-bottom:10px;
    }

    /*==========================
    NOTICE
    ==========================*/

    .notice{
        background:#EEF7FF;
        border-left:6px solid #1877F2;
        padding:18px;
        border-radius:16px;
        font-size:15px;
        line-height:1.8;
        color:#333;
        margin-bottom:30px;
        box-shadow:
        0 10px 25px rgba(24,119,242,.08);
    }

    .notice b{
        color:#1877F2;
    }

    /*==========================
    BUTTON
    ==========================*/

    .followBtn{
        width:100%;
        height:68px;
        border:none;
        border-radius:18px;
        background:
        linear-gradient(90deg,#1877F2,#0B5ED7);
        color:white;
        font-size:20px;
        font-weight:700;
        cursor:pointer;
        display:flex;
        justify-content:center;
        align-items:center;
        gap:14px;
        transition:.35s;
        box-shadow:
        0 14px 35px rgba(24,119,242,.32);
    }

    .followBtn:hover{
        transform:translateY(-5px);
        box-shadow:
        0 22px 45px rgba(24,119,242,.42);
    }

    .followBtn:active{
        transform:scale(.98);
    }

    .fbIcon{
        width:28px;
        height:28px;
    }

    /*==========================
    FOOTER
    ==========================*/

    .footer{
        margin-top:20px;
        text-align:center;
        font-size:14px;
        color:#7A7A7A;
        line-height:1.9;
    }

    .footer span{
        color:#1877F2;
        font-weight:700;
    }

    .divider{
        width:70px;
        height:4px;
        background:
        linear-gradient(90deg,#1877F2,#00B5FF);
        border-radius:20px;
        margin:25px auto;
    }
    
    @media (max-width:900px){

        .container{
            max-width:500px;
        }

        .title{
            font-size:38px;
        }

        .bigTitle{
            font-size:28px;
        }

    }

    @media (max-width:768px){
        body{
            padding:25px;
            overflow:auto;
        }

        .container{
            width:100%;
            max-width:480px;
        }

        .card{
            padding:35px 25px;
            border-radius:28px;
        }

        .logo{
            width:100px;
        }

        .club{
            font-size:11px;
            letter-spacing:2px;
        }

        .title{
            font-size:34px;
        }

        .slogan{
            font-size:14px;
        }

        .photoIcon{
            font-size:48px;
        }

        .bigTitle{
            font-size:24px;
        }

        .desc{
            font-size:16px;
            line-height:1.8;
        }

        .notice{
            font-size:14px;
            padding:16px;
        }

        .followBtn{
            height:60px;
            font-size:19px;
            border-radius:15px;
        }

        .footer{
            font-size:13px;
        }

        .cap{
            font-size:34px;
        }

        .circle1{
            width:350px;
            height:350px;
            top:-150px;
            left:-150px;
        }

        .circle2{
            width:220px;
            height:220px;
        }

    }

    @media (max-width:480px){

        .card{
            padding:28px 18px;
        }

        .logo{
            width:85px;
        }

        .club{
            font-size:11px;
        }

        .title{
            font-size:30px;
        }

        .slogan{
            font-size:13px;
            margin-bottom:22px;
        }

        .photoIcon{
            font-size:42px;
        }

        .bigTitle{
            font-size:21px;
        }

        .desc{
            font-size:15px;
            margin-bottom:22px;
        }

        .notice{
            font-size:13px;
            line-height:1.7;
        }

        .followBtn{
            height:55px;
            font-size:17px;
        }

        .footer{
            font-size:12px;
        }

        .cap{
            font-size:28px;
            opacity:.08;
        }

    }

    /*==========================
    SMALL ANIMATION
    ==========================*/

    .followBtn{
    position:relative;
    overflow:hidden;
    }

    .followBtn::before{
        content:"";
        position:absolute;
        top:0;
        left:-120%;
        width:80%;
        height:100%;
        background:
        linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.45),
        transparent);
        transition:.8s;
    }

    .followBtn:hover::before{
        left:130%;
    }

    /*==========================
    PHOTO ICON GLOW
    ==========================*/

    .photoIcon{
        text-shadow:
        0 0 20px rgba(255,170,0,.4),
        0 0 35px rgba(255,170,0,.25);
    }

    /*==========================
    CARD HOVER
    ==========================*/

    .card{
        transition:.45s;
    }

    .card:hover{
        transform:
        translateY(-6px);
        box-shadow:
        0 40px 80px rgba(0,0,0,.22);
    }

    /*==========================
    SCROLL BAR
    ==========================*/

    ::-webkit-scrollbar{
        width:8px;
    }

    ::-webkit-scrollbar-thumb{
        background:#1877F2;
        border-radius:50px;
    }

    ::-webkit-scrollbar-track{
        background:white;
    }

    .bg{
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        object-fit:cover;
        object-position:center;
        z-index:-2;
    }

    body::before{
        content:"";
        position:fixed;
        inset:0;
        background:rgba(255,255,255,.08);
        z-index:-1;
    }

    .top{
        width:540px;
        max-width:82vw;
        margin:0 auto 12px;
        display:flex;
        flex-direction:column;
        align-items:center;
        text-align:center;
    }

    .title{
        font-family: "Bruce", sans-serif;
        font-size: 40px;
        
    }
</style>
<body>

    <!-- Background -->
    <img src="Back1.png" class="bg">
    <div class="bg-circle circle1"></div>
    <div class="bg-circle circle2"></div>
    <div class="bg-circle circle3"></div>
    <div class="bg-circle circle4"></div>

    <!-- Confetti -->

    <div class="confetti c1"></div>
    <div class="confetti c2"></div>
    <div class="confetti c3"></div>
    <div class="confetti c4"></div>
    <div class="confetti c5"></div>
    <div class="confetti c6"></div>
    <div class="confetti c7"></div>
    <div class="confetti c8"></div>

    <!-- Graduation Caps -->

    <div class="cap cap1">🎓</div>
    <div class="cap cap2">🎓</div>
    <div class="cap cap3">🎓</div>
    <div class="cap cap4">🎓</div>

    <!-- MAIN -->
    <div>
        <div class="top">
            <img src="LOGO.png" class="logo">

            <div class="club">
            BỘ PHẬN TRUYỀN THÔNG TRƯỜNG CƠ KHÍ - Ô TÔ
            </div>

            <div class="title">
            SMAE MEDIA
        </div>
    </div>

    <div class="container">
        <div class="card">
        <div class="photoIcon">
            📸
        </div>

        <div class="bigTitle">
            NHẬN ẢNH
            TỐT NGHIỆP
        </div>

        <div class="desc" style="font-size: 18px;">
            Bạn hãy Follow Fanpage<br>
            rồi quay lại trang này<br>
            để nhận ảnh nhé ❤️
        </div>

        <button
            class="followBtn"
            id="followBtn">
            <svg class="fbIcon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="white">
            <path d="M22 12a10 10 0 1 0-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.23.2 2.23.2v2.45h-1.25c-1.24 0-1.63.77-1.63 1.56V12h2.77l-.44 2.89h-2.33v6.99A10 10 0 0 0 22 12z"/>
            </svg>
            FOLLOW FANPAGE
        </button>

        <div class="footer">

        <div class="divider"></div>
            🎓 Graduation 2026
            Powered by
            <span>
                SMAE MEDIA
            </span>
        </div>
        </div>
        </div>
    </div>
    <!-- ==========================
    ANIMATION EFFECT
    ========================== -->

    <style>
    .logo{
        animation:logoFloat 4s ease-in-out infinite;
    }

    @keyframes logoFloat{
        0%{
            transform:translateY(0px);
        }

        50%{
            transform:translateY(-8px);
        }

        100%{
            transform:translateY(0px);
        }
    }

    .title{
        animation:titleFade .8s ease;
    }

    @keyframes titleFade{

    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
    }

    .card{
    animation:cardShow .8s ease;
    }

    @keyframes cardShow{
        from{
            opacity:0;
            transform:translateY(40px) scale(.95);
        }
        to{
            opacity:1;
            transform:translateY(0) scale(1);
        }
    }

    .followBtn{
        position:relative;
        overflow:hidden;
    }

    .followBtn::after{
        content:"";
        position:absolute;
        top:-40%;
        left:-120%;
        width:70%;
        height:180%;
        background:
        linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,.55),
        transparent);
        transform:rotate(25deg);
        transition:.8s;
    }

    .followBtn:hover::after{
        left:150%;
    }

    .followBtn:hover{
        background:
        linear-gradient(90deg,#0d6efd,#008cff);
    }

    .notice{
        animation:pulse 2.5s infinite;
    }

    @keyframes pulse{
        0%{
            box-shadow:
            0 0 0 rgba(24,119,242,.15);
        }

        50%{
            box-shadow:
            0 0 20px rgba(24,119,242,.18);
        }

        100%{
            box-shadow:
            0 0 0 rgba(24,119,242,.15);
        }
    }

    .footer{
        opacity:.85;
        transition:.3s;
    }

    .footer:hover{
        opacity:1;
    }

    .photoIcon{
        display:inline-block;
        animation:cameraFloat 3s ease-in-out infinite;
    }

    @keyframes cameraFloat{
        0%{
            transform:rotate(0deg);
        }

        25%{
            transform:rotate(-5deg);
        }

        50%{
            transform:rotate(5deg);
        }

        75%{
            transform:rotate(-3deg);
        }

        100%{
            transform:rotate(0deg);
        }
    }

    body{
        background-size:200% 200%;
        animation:bgMove 12s ease infinite;
    }

    @keyframes bgMove{
        0%{
        background-position:left top;
        }

        50%{
        background-position:right bottom;
        }

        100%{
        background-position:left top;
        }
    }

    </style>

    <script>
        const followLink = "https://www.facebook.com/SMAEMedia.HaUI?locale=vi_VN";
        const followBtn = document.getElementById("followBtn");

        // Kiểm tra trạng thái Follow
        function checkFollowStatus(){
            const followTime = Number(sessionStorage.getItem("followTime"));
            if(!followTime) return;
            const passed = Math.floor((Date.now() - followTime) / 1000);
            if(passed >= 20){
                // Đủ 20 giây
                sessionStorage.removeItem("followTime");
                window.location.href = "receive.html";
            }else{
                // Chưa đủ 20 giây
                window.location.href = "notice.html";
            }
        }
        // Khi bấm Follow
        followBtn.onclick = function(){
            // Lưu thời điểm bấm
        sessionStorage.setItem("followTime", Date.now());
            // Mở Fanpage
            window.open(followLink, "_blank");
        }

        // Khi người dùng quay lại
        window.addEventListener("pageshow", checkFollowStatus);
        window.addEventListener("focus", checkFollowStatus);
        document.addEventListener("visibilitychange", function () {

            if (!document.hidden) {
                checkFollowStatus();
            }

        });

        // Kiểm tra khi tải trang
        checkFollowStatus();

    </script>

</body>

</html>
